<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>زمرت 🍓 | لعبة الفواكه</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><header><div class="brand">🍓 <b>زمرت</b><small>لعبة الفواكه</small></div><button id="restart" class="ghost">جولة جديدة</button></header><section id="setup" class="panel setup"><div class="hero">🍎 🍌 🍇 🍓 🍉</div><h1>جاهز للجولة؟</h1><p>اجمع كل أوراقك من نفس الفاكهة وكن أول من يقول «زمرت!»</p><label>عدد اللاعبين<select id="playerCount"><option>3</option><option selected>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select></label><label>اسمك<input id="playerName" maxlength="14" value="أحمد"></label><button id="start" class="primary">ابدأ اللعب 🎮</button></section><section id="game" class="hidden"><div class="status"><span>الجولة <b id="roundText">1</b></span><span>اختر ورقة</span><span>🏆 <b id="scoreText">0</b></span></div><div id="opponents" class="opponents"></div><section class="table"><div class="table-title"><span>أوراقك</span><span id="countText"></span></div><div id="hand" class="hand"></div><button id="pass" class="pass" disabled>مرّر الورقة ➡️</button><button id="zamrat" class="zamrat">زمرت! 🔥</button></section><div id="feed" class="feed"></div></section><section id="result" class="panel result hidden"><div id="resultIcon">🏆</div><h2 id="resultTitle"></h2><p id="resultSub"></p><div id="leaderboard"></div><button id="next" class="primary">جولة جديدة</button></section></main><div id="toast" class="toast"></div><script src="script.js"></script></body></html>
