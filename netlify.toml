[build]
  command = "pnpm --filter @workspace/zamrat... run build"
  publish = "artifacts/zamrat/dist/public"

[build.environment]
  NODE_VERSION = "24"
  PNPM_FLAGS = "--no-frozen-lockfile"
  VITE_API_BASE_URL = "https://zmrt-api.onrender.com"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200